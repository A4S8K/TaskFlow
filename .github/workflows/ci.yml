name: TaskFlow CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: taskflow-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: ci_ephemeral_password
          POSTGRES_DB: taskflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://taskflow:ci_ephemeral_password@localhost:5432/taskflow_migrations
      TEST_DATABASE_URL: postgresql+psycopg://taskflow:ci_ephemeral_password@localhost:5432/taskflow_test
      JWT_SECRET: ci-only-ephemeral-test-signing-secret-32-characters
      APP_ENV: test
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12.15', cache: pip, cache-dependency-path: backend/constraints.txt }
      - run: python -m pip install --upgrade pip==26.2
      - run: python -m pip install -c constraints.txt -e '.[test]'
      - run: ruff check .
      - run: DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head
      - run: pytest -q
      - run: DATABASE_URL="$TEST_DATABASE_URL" alembic check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Synthetic public origin for compilation tests, never a deployment URL.
          VITE_API_URL: https://api.taskflow.invalid
      - run: npm audit --audit-level=high
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Generate disposable Compose settings
        run: |
          python - <<'PY'
          import pathlib, secrets
          pathlib.Path('.env').write_text(
              'POSTGRES_USER=taskflow\nPOSTGRES_DB=taskflow\n'
              f'POSTGRES_PASSWORD={secrets.token_urlsafe(36)}\n'
              f'JWT_SECRET={secrets.token_urlsafe(48)}\n'
          )
          PY
      - run: docker compose up -d --wait db
      - run: docker compose build backend frontend
      - name: Explicit disposable database migration
        run: docker compose run --rm backend alembic upgrade head
      - run: docker compose up -d backend frontend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: for i in $(seq 1 60); do curl -fsS http://localhost:8000/ready && exit 0; sleep 2; done; exit 1
      - run: curl --retry 60 --retry-connrefused --retry-delay 2 -fsS http://localhost:5173
      - run: npm run test:e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_REUSE_SERVER: '1'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
