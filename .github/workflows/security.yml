name: Dependency and secret checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python-advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12.15' }
      - run: python -m pip install --upgrade pip==26.2
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --no-deps --disable-pip --progress-spinner off -r backend/constraints.txt
  git-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Verify pinned scanner and scan complete Git history
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location "${base}/${archive}" --output "$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location "${base}/gitleaks_${version}_checksums.txt" --output "$RUNNER_TEMP/checksums.txt"
          cd "$RUNNER_TEMP"
          grep " $archive$" checksums.txt | sha256sum --check -
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --no-banner --log-opts='--all' "$GITHUB_WORKSPACE"
