services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Local container verification profile; cloud uses render.yaml production settings.
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-taskflow}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CORS_ORIGINS: '["http://localhost:8080"]'
      TRUSTED_HOSTS: '["localhost","127.0.0.1","backend"]'
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: {context: ./frontend, target: production}
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    depends_on: [backend]
volumes:
  postgres_data:
