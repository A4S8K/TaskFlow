[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.143.3,<1", "starlette>=1.8.0,<2", "uvicorn>=0.34,<1", "sqlalchemy>=2.0.40,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "pydantic-settings>=2.8,<3", "email-validator>=2.2,<3", "PyJWT>=2.10,<3", "argon2-cffi>=23.1,<26"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["i18n/locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
